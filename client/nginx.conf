server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable, so they can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths must fall back to index.html so that
    # refreshing on /transactions is handled by React Router, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
